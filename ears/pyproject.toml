[project]
name = "ears"
version = "0.1.0"
description = "Cantina's local speech sidecar: keyword spotting (Vosk) and transcripts (Whisper). Memory only."
requires-python = ">=3.12"
dependencies = [
  "websockets>=13",
  "numpy>=1.26",
]

[project.optional-dependencies]
# Installed by `npm run setup` on the Mac. Kept optional so tests run without models (DECISIONS D-006).
speech = [
  "vosk>=0.3.45",
  "silero-vad>=5.1",
  "mlx-whisper>=0.4; sys_platform == 'darwin' and platform_machine == 'arm64'",
  "pywhispercpp>=1.2; sys_platform != 'darwin' or platform_machine != 'arm64'",
]
analysis = [
  "librosa>=0.10",
]

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "ruff>=0.6",
]

[project.scripts]
ears = "ears.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ears"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"
